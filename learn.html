<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Playground Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1d3a; color: #fff; font-family: Arial, sans-serif; line-height: 1.5; }
    header { padding: 16px 20px; border-bottom: 1px solid #1f3a66; font-family: 'Orbitron', sans-serif; color: #4fc3f7; font-size: 1.2rem; }
    header span { color: #f5b301; }
    header a { color: #cfd8e3; font-family: Arial, sans-serif; font-size: 0.85rem; margin-left: 14px; text-decoration: none; }
    main { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { font-family: 'Orbitron', sans-serif; color: #4fc3f7; font-size: 1.6rem; margin: 10px 0 6px; }
    .sub { color: #cfd8e3; margin: 0 0 8px; }
    #overall { color: #f5b301; font-size: 0.9rem; margin-bottom: 18px; }
    #resume a { display: block; background: #f5b301; color: #0b1d3a; font-weight: bold; text-decoration: none; padding: 14px 18px; border-radius: 10px; margin-bottom: 22px; }
    #resume small { display: block; font-weight: normal; opacity: 0.85; }
    .track { background: #112b52; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; border-left: 4px solid #2a4c80; }
    .track.live { border-left-color: #f5b301; }
    .thead { display: flex; gap: 14px; align-items: flex-start; }
    .num { background: #0b1d3a; color: #f5b301; font-family: 'Orbitron', sans-serif; border-radius: 8px; min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
    .thead h2 { margin: 0 0 4px; font-size: 1.1rem; color: #fff; }
    .thead p { margin: 0; color: #cfd8e3; font-size: 0.92rem; }
    .badge { margin-left: auto; font-size: 0.75rem; border: 1px solid #4fc3f7; color: #4fc3f7; border-radius: 12px; padding: 2px 10px; white-space: nowrap; }
    .badge.soon { border-color: #7f93b0; color: #7f93b0; }
    .mod { margin: 18px 0 4px; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1px; color: #f5b301; }
    .mod.soonmod { color: #7f93b0; display: flex; justify-content: space-between; gap: 10px; text-transform: none; letter-spacing: 0; font-size: 0.92rem; background: #0b1d3a; border-radius: 8px; padding: 10px 14px; margin-top: 10px; }
    .lesson { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: #0b1d3a; border: 1px solid #1f3a66; border-radius: 8px; padding: 12px 14px; margin-top: 8px; color: #fff; text-decoration: none; }
    .lesson:hover { border-color: #f5b301; }
    .lesson small { color: #4fc3f7; white-space: nowrap; }
    .lesson.done small { color: #81c784; }
  </style>
</head>
<body>
  <header>Data <span>Playground</span> &middot; Learn
    <a href="index.html">Home</a><a href="workbench.html">SQL</a><a href="python.html">Python</a>
  </header>
  <main>
    <h1>Your learning path</h1>
    <p class="sub">Follow the tracks in order from beginner to professional, or jump to the topic you need. Every lesson runs on real data, right in your browser.</p>
    <div id="overall"></div>
    <div id="resume"></div>
    <div id="tracks"></div>
  </main>

  <script src="lessons-data.js"></script>
  <script>
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem('dp_progress') || '{}'); } catch (e) { return {}; }
    }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    const progress = loadProgress();
    let last = null;
    try { last = localStorage.getItem('dp_last'); } catch (e) {}
    const root = document.getElementById('tracks');

    if (typeof TRACKS === 'undefined' || typeof catalogMetas === 'undefined') {
      root.textContent = 'Could not read lessons-data.js. Check that the file exists in your repo.';
    } else {
      const metas = catalogMetas();
      let totalDone = 0, totalAll = 0;
      TRACKS.forEach((t, i) => {
        const ls = metas.filter(m => m.track === t.id);
        const planned = PLANNED.filter(p => p.track === t.id && !MODULES.some(m => m.id === p.id));
        let html = '<div class="thead"><div class="num">' + (i + 1) + '</div><div><h2>' + esc(t.title) + '</h2><p>' + esc(t.desc) + '</p></div>';
        html += ls.length
          ? '<span class="badge">' + ls.length + ' lesson' + (ls.length === 1 ? '' : 's') + '</span>'
          : '<span class="badge soon">Coming soon</span>';
        html += '</div>';
        let lastMod = null;
        ls.forEach(l => {
          if (l.module !== lastMod) { html += '<div class="mod">' + esc(l.module) + '</div>'; lastMod = l.module; }
          const done = l.ex.filter(id => progress[id]).length;
          totalDone += done; totalAll += l.ex.length;
          const complete = l.ex.length > 0 && done === l.ex.length;
          const label = complete
            ? 'Completed \u2713 \u00b7 Review \u2192'
            : (done > 0 ? 'Continue \u00b7 ' + done + ' / ' + l.ex.length + ' \u2192' : 'Start \u00b7 ' + l.ex.length + ' exercises \u2192');
          html += '<a class="lesson' + (complete ? ' done' : '') + '" href="lessons.html?lesson=' + encodeURIComponent(l.id) + '">' +
            '<span>' + esc(l.title) + '</span><small>' + label + '</small></a>';
        });
        planned.forEach(p => {
          html += '<div class="mod soonmod"><span>' + esc(p.title) + '</span><span>Coming soon</span></div>';
        });
        const el = document.createElement('section');
        el.className = 'track' + (ls.length ? ' live' : '');
        el.innerHTML = html;
        root.appendChild(el);
      });
      document.getElementById('overall').textContent = 'Your progress: ' + totalDone + ' / ' + totalAll + ' exercises completed';

      const lastMeta = last ? metas.find(m => m.id === last) : null;
      if (lastMeta) {
        document.getElementById('resume').innerHTML =
          '<a href="lessons.html?lesson=' + encodeURIComponent(lastMeta.id) + '">Continue where you stopped \u2192<small>' + esc(lastMeta.title) + '</small></a>';
      }
    }
  </script>
</body>
</html>
