<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1d3a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      margin: 0 0 10px;
      color: #4fc3f7;
    }
    h1 span { color: #f5b301; }
    p { font-size: 1.1rem; color: #cfd8e3; max-width: 500px; }
    .badge {
      margin-top: 24px;
      padding: 8px 18px;
      border: 1px solid #f5b301;
      border-radius: 20px;
      color: #f5b301;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Data <span>Playground</span></h1>
  <p>Learn data analysis. Build real projects. Do your full analysis, all in one place.</p>
  <div class="badge">Coming soon</div>
</body>
</html>
